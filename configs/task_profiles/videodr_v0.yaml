task_name: videodr_v0
mode: workflow
input_mode: video
output_mode: short_answer
clip_duration: 30
frame_sampling_fps: 2
max_frames_per_clip: 16
enable_asr: false
asr_backend: none
enable_online_multimodal: true
max_multimodal_observation_calls: 2
max_images_per_multimodal_call: 3
enable_depth: false
enable_thermal: false
enable_llm_judge: true
judge_model: gpt-4o-mini
judge_prompt_version: v0
retriever_type: default
topk_local: 5
topk_web: 5
max_steps: 3
max_agent_iterations: 3
retrieval_budget: 5
trace_level: full
required_outputs:
  - answer
  - evidence
  - trace
  - judge
